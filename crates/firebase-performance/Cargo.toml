[package]
name = "firebase-performance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Firebase Performance Monitoring for the Firebase Rust SDK"
keywords = ["firebase"]
categories = ["api-bindings", "web-programming"]

[features]
default = []
wasm-web = ["firebase-core/wasm-web", "firebase-installations/wasm-web", "dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
experimental-indexed-db = ["firebase-core/experimental-indexed-db", "firebase-installations/experimental-indexed-db"]

[dependencies]
firebase-core.workspace = true
firebase-installations = { path = "../firebase-installations", version = "1.34.1" }
async-lock.workspace = true
async-trait.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[dev-dependencies]
# Credentials arrive through the component container, so the producers are needed only to
# prove that end of the wiring in tests.
firebase-app-check = { path = "../firebase-app-check", version = "1.34.1", features = ["test-support"] }
firebase-core = { workspace = true, features = ["test-support"] }

# httpmock and the multi-threaded runtime are native-only; the wasm test runner needs neither, and
# pulling tokio's `net` feature into a wasm build fails to compile.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
httpmock.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
