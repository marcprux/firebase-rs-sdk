[package]
name = "firebase-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cloud Storage for Firebase, for the Firebase Rust SDK"
keywords = ["firebase"]
categories = ["api-bindings", "web-programming"]

[features]
default = []
wasm-web = ["firebase-core/wasm-web", "firebase-auth/wasm-web", "firebase-app-check/wasm-web", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
experimental-indexed-db = ["firebase-core/experimental-indexed-db", "firebase-auth/experimental-indexed-db", "firebase-app-check/experimental-indexed-db"]

[dependencies]
firebase-core.workspace = true
firebase-auth = { path = "../firebase-auth", version = "1.34.1" }
firebase-app-check = { path = "../firebase-app-check", version = "1.34.1" }
base64.workspace = true
bytes.workspace = true
futures.workspace = true
percent-encoding.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json"] }

[dev-dependencies]
firebase-core = { workspace = true, features = ["test-support"] }

# httpmock and the multi-threaded runtime are native-only; the wasm test runner needs neither, and
# pulling tokio's `net` feature into a wasm build fails to compile.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
httpmock.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
