name: live-tests

# Exercises the Firebase backends: the Local Emulator Suite for everything that has an emulator
# (no secrets needed) and the real project, with the credentials stored in repository secrets, for
# the services that don't (Installations, Remote Config).
#
# Required secret:
#   FIREBASE_GOOGLE_SERVICES_JSON  - the full contents of the app's google-services.json
#                                    (Firebase console > Project settings > Your apps > Download).
# Optional secret:
#   FIREBASE_TEST_CALLABLE         - name of a deployed callable function to invoke.
#
# Secrets are not exposed to pull requests from forks, so the job only runs on pushes to main,
# on pull requests from branches of this repository, and on manual dispatch. When the secret is
# absent the tests skip themselves (see tests/live_endpoints.rs); on main they are required.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly, catches backend drift

permissions:
  contents: read

concurrency:
  group: live-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    # Fork PRs cannot read secrets; skip rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      FIREBASE_TEST_CALLABLE: ${{ secrets.FIREBASE_TEST_CALLABLE }}
      # Fail loudly on main if the secret is missing; elsewhere the tests skip gracefully.
      FIREBASE_LIVE_TESTS_REQUIRED: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Only the services without an emulator run against the online project; everything else
      # runs in the `emulator` job below.
      - name: Run online-only endpoint tests (Installations, Remote Config, probe)
        env:
          # Keep the installations cache out of the checkout (runner context is step-scoped).
          FIREBASE_INSTALLATIONS_CACHE_DIR: ${{ runner.temp }}/firebase-installations
        run: >-
          cargo test --test live_endpoints -- --ignored --nocapture --test-threads=2
          installations remote_config live_project_probe

  # Runs Auth, Firestore, Storage and Functions tests against the Firebase Local Emulator Suite.
  # Needs no secrets, so it also runs for pull requests from forks.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase-emulator/functions/package-lock.json

      - name: Set up Java (required by the Firestore and Storage emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase-emulator/firebase.json') }}

      - name: Install Firebase CLI and the callable fixtures
        run: |
          npm install -g firebase-tools
          npm ci --prefix firebase-emulator/functions

      - name: Run endpoint tests against the emulators
        run: scripts/emulator_test.sh
